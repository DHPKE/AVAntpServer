<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVAntp Server</title>
<link rel="icon" href="data:,">
<meta name="color-scheme" content="dark">
<style>
:root{--bg:#1b1d20;--surface:#25282c;--border:#3a3f45;--text:#d9dce1;--muted:#8a919a;--field:#17191c;--accent:#008FD0;--accent-rgb:0,143,208;--ok:color-mix(in srgb,var(--accent) 70%,#fff);--yellow:#f59e0b;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font-family:'SF Mono','Fira Code',Consolas,monospace;font-size:12px}
[v-cloak]{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10}
header h1{font-size:13px;font-weight:700;letter-spacing:.08em;border-left:3px solid var(--accent);padding-left:9px}
.sub{font-size:10px;color:var(--muted);display:flex;gap:14px;align-items:center}.sub b{color:var(--text)}
.pill{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;border:1px solid;font-size:10px;font-weight:700;letter-spacing:.1em;white-space:nowrap}
.live{border-color:var(--ok);color:var(--ok)}.error{border-color:var(--red);color:var(--red)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}.live .dot{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.tab-nav{display:flex;gap:1px;background:var(--border);border-radius:8px;padding:1px}
.tab-btn{padding:4px 14px;border-radius:7px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:10px;font-weight:700;letter-spacing:.1em;font-family:inherit}
.tab-btn.active{background:var(--surface);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;overflow:auto}
.full{grid-column:1/-1}
.lbl{font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.ring{width:84px;height:84px;border-radius:50%;border:3px solid;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 10px}
@keyframes ringBeat{0%{box-shadow:0 0 36px rgba(var(--accent-rgb),.75),0 0 10px rgba(var(--accent-rgb),.5)}100%{box-shadow:0 0 12px rgba(var(--accent-rgb),.16)}}
.ring.ok{border-color:var(--ok);color:var(--ok);box-shadow:0 0 12px rgba(var(--accent-rgb),.16)}
/* the script restarts this class on every full second: one flash per second, in step with the clock */
.ring.ok.beat{animation:ringBeat 1s ease-out 1}
@media (prefers-reduced-motion:reduce){.ring.ok.beat{animation:none}}
.ring.bad{border-color:var(--red);color:var(--red)}.ring.warn{border-color:var(--yellow);color:var(--yellow)}
.sname{text-align:center;font-size:16px;font-weight:700;letter-spacing:.1em}
.smeta{text-align:center;font-size:10px;color:var(--muted);margin-top:3px}
.lbl.fold{cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}.lbl.fold:hover{color:var(--text)}
.lbl.fold .chev{font-size:11px;letter-spacing:0}
.tcnow{font-size:15px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--ok)}.tcnow.idle{color:var(--muted)}
.tclock{font-size:32px;font-weight:700;letter-spacing:.04em;color:var(--ok);text-align:center;font-variant-numeric:tabular-nums;padding-top:6px}
.tdate{font-size:10px;color:var(--muted);text-align:center;margin-top:4px}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}.bigunit{font-size:15px;font-weight:400;margin-left:3px}
.bigsub{font-size:10px;color:var(--muted);margin-top:5px}
.good{color:var(--ok)}.warnc{color:var(--yellow)}.badc{color:var(--red)}
.cr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}.ck{color:var(--muted);font-size:10px}.cv{font-size:10px;font-weight:600}
.div{margin:10px 0;border-top:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th{font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;text-align:left;padding:4px 6px 6px}
td{padding:5px 6px;border-top:1px solid var(--border);font-size:11px;white-space:nowrap}
.nicpill{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border:1px solid var(--border);border-radius:20px;font-size:10px;font-weight:600;margin:0 8px 8px 0}
.nicpill.up{border-color:var(--ok);color:var(--ok)}.nicpill.down{opacity:.45;color:var(--muted)}
.sform{padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sfull{grid-column:1/-1}
.sf{margin-bottom:10px}.sf:last-child{margin-bottom:0}
.slbl{font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:4px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;background:var(--field);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:11px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
td input[type=text],td input[type=number],td select{min-width:70px;padding:3px 6px}
textarea{resize:vertical;min-height:70px}
.sradio{display:flex;gap:12px;padding:4px 0}.sradio label,.chk{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:10px}
.btn{padding:7px 22px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-weight:700;font-size:11px;letter-spacing:.1em;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);padding:4px 12px}.btn.ghost:hover{border-color:var(--accent)}
.sst{font-size:10px;padding:5px 10px;border-radius:4px;margin:0 16px 8px}
.sst.ok{background:rgba(var(--accent-rgb),.14);color:var(--ok)}.sst.err{background:rgba(239,68,68,.1);color:var(--red)}
.banner{margin:12px 16px 0;padding:8px 12px;border-left:3px solid var(--yellow);background:rgba(245,158,11,.08);border-radius:0 4px 4px 0;font-size:10px}
.banner.ok{border-left-color:var(--ok);background:rgba(var(--accent-rgb),.12)}
.banner.red{border-left-color:var(--red);background:rgba(239,68,68,.1)}
.actions{padding:0 16px 16px;display:flex;gap:10px;align-items:center}
.login{max-width:340px;margin:12vh auto;padding:0 16px}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;background:rgba(var(--accent-rgb),.18);color:var(--accent);font-size:9px;font-weight:700}
@media(max-width:900px){.grid,.sform{grid-template-columns:1fr}}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}

.logbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:10px}
.logbar .f{min-width:130px}.logbar select{min-width:130px}
.logbox{background:var(--field);border:1px solid var(--border);border-radius:6px;padding:10px 12px;height:52vh;overflow:auto;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.logbox .ln.bad{color:var(--red)}.logbox .ln.warn{color:var(--yellow)}.logbox .ln.dim{color:var(--muted)}
.pillbtn{padding:2px 9px;border-radius:12px;border:1px solid var(--border);font-size:9px;font-weight:700;letter-spacing:.08em}
.pillbtn.bad{color:var(--red);border-color:var(--red)}.pillbtn.good{color:var(--ok);border-color:var(--ok)}.pillbtn.warn{color:var(--yellow);border-color:var(--yellow)}
</style>
</head>
<body>
<div id="app" v-cloak>
  <div class="login" v-if="!user">
    <div class="card">
      <div class="lbl">AVAntp Server · Login</div>
      <div v-if="needsSetup" class="banner red" style="margin:0 0 10px">No user exists yet. On the box run: <b>sudo avantp-passwd admin</b></div>
      <form @submit.prevent="doLogin">
        <div class="sf"><label class="slbl" for="u">User</label><input id="u" type="text" v-model="lu" autocomplete="username" autofocus></div>
        <div class="sf"><label class="slbl" for="p">Password</label><input id="p" type="password" v-model="lp" autocomplete="current-password"></div>
        <div class="sf"><button class="btn" :disabled="busy">LOGIN</button></div>
        <div v-if="loginErr" class="sst err" style="margin:10px 0 0">{{ loginErr }}</div>
      </form>
    </div>
  </div>

  <template v-else>
  <header>
    <h1>AVAntp Server</h1>
    <div class="tab-nav">
      <button v-for="t in tabs" :key="t" class="tab-btn" :class="{active:tab===t}" @click="tab=t">{{ t.toUpperCase() }}</button>
    </div>
    <div class="sub"><span>UTC&nbsp;<b>{{ utcNow }}</b></span><span>{{ user }}</span><button class="btn ghost" @click="doLogout">LOGOUT</button></div>
    <div class="pill" :class="connected?'live':'error'"><span class="dot"></span>{{ connected?'LIVE':'RECONNECTING…' }}</div>
  </header>

  <div class="banner red" v-if="ap.state==='pending-confirm'">Applied to the system. Confirm within <b>{{ left }} s</b> that you can still reach this page, or the previous setup is restored automatically.
    <button class="btn" style="margin-left:12px" :disabled="busy" @click="confirm">CONFIRM</button></div>
  <div class="banner" v-else-if="ap.state==='applying'">Applying to the system&hellip; the connection may drop for a few seconds.</div>
  <div class="banner" v-else-if="draftDirty">Unsaved changes. Press <b>SAVE</b> on the tab you edited.</div>
  <div class="banner" v-else-if="hasPending">Saved, but not active on the system yet.
    <button class="btn" style="margin-left:12px" :disabled="busy" @click="applyNow">APPLY TO SYSTEM</button></div>
  <div class="banner red" v-if="recent(ap) && ap.state==='rolled-back'">Rolled back: {{ ap.reason }}</div>
  <div class="banner red" v-if="recent(ap) && ap.state==='error'">Apply refused: {{ ap.error }}</div>
  <div class="banner ok" v-if="recent(ap, 60) && ap.state==='applied'">Applied and confirmed.</div>
  <div class="banner red" v-if="restartNotice">The box restarted unexpectedly: the previous boot ended at <b>{{ restartNotice.at }}</b> without a shutdown (power loss, reset or crash).
    <button class="btn ghost" style="margin-left:12px" @click="tab='log'">OPEN LOG</button>
    <button class="btn ghost" style="margin-left:6px" @click="dismissRestart">DISMISS</button></div>
  <div class="banner" v-if="um.state==='on'">UPDATE MODE is on: this box may reach package servers (web ports 80/443 on the WAN) for another <b>{{ umLeftText }}</b>. It closes by itself.</div>
  <div class="banner red" v-if="draft && draft.wan.commissioning">COMMISSIONING is on: SSH and this WebUI are reachable from the WAN side. Switch it off in NETWORK once a management VLAN works.</div>

  <!-- MONITOR -->
  <div class="grid" v-if="tab==='monitor'">
    <div class="card">
      <div class="lbl">Sync state</div>
      <div class="ring" :class="syncCls">{{ syncIcon }}</div>
      <div class="sname" :class="syncTxt">{{ syncName }}</div>
      <div class="smeta">Stratum {{ tr ? tr.stratum : '—' }} · {{ tr ? tr.ref_host || tr.ref_name || tr.ref_id : '—' }}</div>
      <div class="div"></div>
      <div class="cr"><span class="ck">Leap status</span><span class="cv">{{ tr ? tr.leap : '—' }}</span></div>
      <div class="cr"><span class="ck">Update interval</span><span class="cv">{{ tr ? tr.update_interval_s.toFixed(0)+' s' : '—' }}</span></div>
      <div class="cr"><span class="ck">Frequency</span><span class="cv">{{ tr ? tr.freq_ppm.toFixed(3)+' ppm' : '—' }}</span></div>
    </div>
    <div class="card">
      <div class="lbl">Current time</div>
      <div class="tclock">{{ utcNow }}</div>
      <div class="tdate">{{ utcDate }} &middot; UTC</div>
      <div class="div"></div>
      <div class="cr"><span class="ck">Clock</span><span class="cv" :class="syncTxt">{{ chronyRunning ? (synced ? 'synchronised' : 'not synchronised') : 'chrony stopped' }}</span></div>
      <div class="cr"><span class="ck">Last update</span><span class="cv">{{ lastUpdate }}</span></div>
    </div>
    <div class="card">
      <div class="lbl">Accuracy</div>
      <div><span class="big" :class="offCls">{{ off.val }}</span><span class="bigunit" :class="offCls">{{ off.unit }}</span></div>
      <div class="bigsub">system offset to upstream NTP</div>
      <div class="div"></div>
      <div class="cr"><span class="ck">RMS offset</span><span class="cv">{{ tr ? fmtS(tr.rms_offset_s) : '—' }}</span></div>
      <div class="cr"><span class="ck">Skew</span><span class="cv">{{ tr ? tr.skew_ppm.toFixed(3)+' ppm' : '—' }}</span></div>
      <div class="cr"><span class="ck">Root delay</span><span class="cv">{{ tr ? fmtS(tr.root_delay_s) : '—' }}</span></div>
      <div class="cr"><span class="ck">Root dispersion</span><span class="cv">{{ tr ? fmtS(tr.root_dispersion_s) : '—' }}</span></div>
    </div>
    <div class="card full">
      <div class="lbl">VLAN clocks<span v-if="!cfg.active" style="text-transform:none;letter-spacing:0"> &middot; showing the saved config, nothing is applied yet</span></div>
      <table v-if="cfgVlans.length"><thead><tr><th>VLAN</th><th>Name</th><th>IP address</th><th>Local time</th><th>Time zone</th><th>NTP</th></tr></thead>
        <tbody><tr v-for="v in cfgVlans" :key="v.id">
          <td>{{ v.id }}</td><td>{{ v.name }}</td><td :class="vlanAddr(v).live ? '' : 'warnc'">{{ vlanAddr(v).text }}</td>
          <td class="good">{{ localTime(v.timezone) }}</td><td>{{ tzLabel(v.timezone) }}</td>
          <td>{{ v.ntp!==false ? 'serving' : 'off' }}</td></tr></tbody></table>
      <div v-else class="smeta" style="text-align:left">No VLANs configured yet. Create them in the VLANS tab.</div>
    </div>
    <div class="card full">
      <div class="lbl">Timecode<span v-if="!tc.running" style="text-transform:none;letter-spacing:0;color:var(--yellow)"> &middot; the timecode service is not running</span></div>
      <table v-if="cfgVlans.length"><thead><tr><th>VLAN</th><th>Name</th><th>Timecode now</th><th>Art-Net</th><th>Last sent</th><th>Packets</th><th>MTC over RTP-MIDI</th></tr></thead>
        <tbody><tr v-for="v in cfgVlans" :key="v.id">
          <td>{{ v.id }}</td><td>{{ v.name }}</td>
          <td><span class="tcnow" :class="{idle: tcStat(v).artnet.state !== 'sending'}">{{ liveTc(v) }}</span>
            <span v-if="tcStat(v).artnet.state !== 'sending'" style="color:var(--muted);font-size:10px"> not sending</span></td>
          <td :class="tcCls(v).artnet">{{ tcText(v).artnet }}</td>
          <td class="good">{{ tcStat(v).artnet.last || '' }}</td><td>{{ tcStat(v).artnet.state === 'sending' ? tcStat(v).artnet.sent : '' }}</td>
          <td :class="tcCls(v).mtc">{{ tcText(v).mtc }}</td></tr></tbody></table>
      <div v-else class="smeta" style="text-align:left">No VLANs configured yet.</div>
      <div class="smeta" style="text-align:left;margin-top:8px">"Timecode now" is the time of day in each VLAN's own time zone, as it would be sent (once per frame). It is only transmitted for VLANs where you switched Art-Net TC on (VLANS tab, then save and apply).</div>
    </div>
    <div class="card full">
      <div class="lbl fold" @click="toggleCard('sources')" title="Click to fold or unfold" role="button" tabindex="0" @keydown.enter="toggleCard('sources')" :aria-expanded="!collapsed.sources">
        <span>Upstream sources<span v-if="collapsed.sources" style="text-transform:none;letter-spacing:0"> &middot; {{ sources.length }} server{{ sources.length === 1 ? '' : 's' }}{{ sources.filter(s => s.state === '*').length ? ', synced to ' + (sources.find(s => s.state === '*').host || sources.find(s => s.state === '*').name) : '' }}</span></span>
        <span class="chev">{{ collapsed.sources ? '▸' : '▾' }}</span></div>
      <template v-if="!collapsed.sources">
      <table v-if="sources.length"><thead><tr><th></th><th>Server</th><th>Address</th><th>Stratum</th><th>Poll</th><th>Reach</th><th>Last rx</th><th>Offset</th></tr></thead>
        <tbody><tr v-for="s in sources" :key="s.name"><td :class="s.state==='*'?'good':''">{{ s.state==='*'?'● used':s.state==='+'?'+ ok':s.state }}</td>
          <td>{{ s.host || s.name }}</td><td style="color:var(--muted)">{{ s.host && s.host !== s.name ? s.name : '' }}</td><td>{{ s.stratum }}</td><td>{{ s.poll }}</td><td>{{ s.reach.toString(8) }}</td><td>{{ s.last_rx_s }} s</td><td>{{ fmtS(s.offset_s) }}</td></tr></tbody></table>
      <div v-else class="smeta" style="text-align:left">{{ chronyRunning ? 'No sources yet.' : 'chrony is not running.' }}</div>
      </template>
    </div>
    <div class="card full">
      <div class="lbl">Interfaces</div>
      <span v-for="i in ifaces" :key="i.name" class="nicpill" :class="i.state==='up'?'up':'down'">
        <span class="dot"></span>{{ i.name }} · {{ i.addrs.join(', ') || (i.state==='up'?'no IPv4':'down') }}</span>
    </div>
  </div>

  <!-- NETWORK -->
  <template v-if="tab==='network' && draft">
  <div class="sform">
    <div class="card"><div class="lbl">WAN (internet side)</div>
      <div class="sf"><label class="slbl">Interface</label><select v-model="draft.wan.iface"><option v-for="n in ifaceNames" :key="n">{{ n }}</option></select></div>
      <div class="sf"><label class="slbl">Addressing</label><div class="sradio">
        <label><input type="radio" value="dhcp" v-model="draft.wan.mode"> DHCP</label>
        <label><input type="radio" value="static" v-model="draft.wan.mode"> Static</label></div></div>
      <template v-if="draft.wan.mode==='static'">
        <div class="sf"><label class="slbl">Address / prefix</label><input type="text" v-model="draft.wan.address" placeholder="10.1.1.24/24"><div class="smeta" style="text-align:left;margin-top:4px">Include the prefix length, for example <b>10.1.1.24/24</b>.</div></div>
        <div class="sf"><label class="slbl">Gateway</label><input type="text" v-model="draft.wan.gateway"></div>
        <div class="sf"><label class="slbl">DNS (comma separated)</label><input type="text" v-model="wanDns"></div>
      </template>
    </div>
    <div class="card"><div class="lbl">LAN (carries the VLANs)</div>
      <div class="sf"><label class="slbl">Interface</label><select v-model="draft.lan.iface"><option v-for="n in ifaceNames" :key="n">{{ n }}</option></select></div>
      <div class="smeta" style="text-align:left">Tagged VLANs only. The LAN side never gets a gateway or DNS and never routes to the WAN.</div>
    </div>
    <div class="card"><div class="lbl">Commissioning</div>
      <label class="chk"><input type="checkbox" v-model="draft.wan.commissioning"> Allow SSH + WebUI from the WAN side</label>
      <div class="smeta" style="text-align:left;margin-top:8px">Temporary. Use it only until a management VLAN is reachable, then switch it off.</div>
    </div>
  </div>
  <div class="sst" :class="msgCls" v-if="msg">{{ msg }}</div>
  <div class="actions"><button class="btn" :disabled="busy" @click="save">SAVE</button></div>
  </template>

  <!-- VLANS -->
  <template v-if="tab==='vlans' && draft">
  <div class="grid"><div class="card full">
    <div class="lbl">VLANs on {{ draft.lan.iface }} ({{ draft.vlans.length }} / 20)</div>
    <table><thead><tr><th>ID</th><th>Name</th><th>Addressing</th><th>Address / prefix</th><th>Time zone</th><th>NTP</th><th>Mgmt</th><th>Art-Net TC</th><th>MTC-RTP</th><th>FPS</th><th></th></tr></thead>
    <tbody><tr v-for="(v,i) in draft.vlans" :key="i">
      <td><input type="number" min="1" max="4094" v-model.number="v.id" style="width:72px"></td>
      <td><input type="text" v-model="v.name" maxlength="32" style="width:150px" title="Letters, digits, space, - _ . ( ) - up to 32 characters"></td>
      <td><select v-model="v.mode"><option value="dhcp">DHCP</option><option value="static">Static</option></select></td>
      <td style="min-width:150px"><input v-if="v.mode==='static'" type="text" v-model="v.address" placeholder="10.20.0.2/24" style="width:130px">
        <span v-else :class="dhcpState(v).cls" :title="dhcpState(v).hint">{{ dhcpState(v).text }}</span></td>
      <td><select v-model="v.timezone" style="min-width:210px"><optgroup v-for="g in tzGroups" :key="g.region" :label="g.region"><option v-for="z in g.zones" :key="z.id" :value="z.id">{{ z.label }}</option></optgroup></select></td>
      <td><input type="checkbox" v-model="v.ntp"></td>
      <td><input type="checkbox" v-model="v.mgmt"></td>
      <td><input type="checkbox" v-model="v.timecode.artnet"></td>
      <td><input type="checkbox" v-model="v.timecode.mtc_rtp"></td>
      <td><select v-model.number="v.timecode.fps"><option>24</option><option>25</option><option>29.97</option><option>30</option></select></td>
      <td><button class="btn ghost" @click="draft.vlans.splice(i,1)">✕</button></td></tr></tbody></table>
    <div style="margin-top:12px"><button class="btn ghost" :disabled="draft.vlans.length>=20" @click="addVlan">+ ADD VLAN</button></div>
    <div class="smeta" style="text-align:left;margin-top:10px">Timecode outputs are off by default. The time zone (pick a city, daylight saving is automatic) sets the VLAN's local time and timecode; NTP itself always carries UTC. DHCP VLANs never accept routes, DNS or NTP from the server.</div>
  </div></div>
  <div class="sst" :class="msgCls" v-if="msg">{{ msg }}</div>
  <div class="actions"><button class="btn" :disabled="busy" @click="save">SAVE</button></div>
  </template>

  <!-- NTP -->
  <template v-if="tab==='ntp' && draft">
  <div class="sform">
    <div class="card"><div class="lbl">Default (preferred)</div>
      <textarea v-model="up.default" placeholder="pool.ntp.org"></textarea><div class="smeta" style="text-align:left;margin-top:6px">One host per line.</div></div>
    <div class="card"><div class="lbl">Backup</div>
      <textarea v-model="up.backup" placeholder="time.cloudflare.com"></textarea></div>
    <div class="card"><div class="lbl">Custom</div>
      <textarea v-model="up.custom" placeholder="ntp.example.org"></textarea></div>
    <div class="card sfull"><label class="chk"><input type="checkbox" v-model="draft.upstream.local_fallback"> Keep serving time (stratum 10) when no upstream is reachable</label>
      <div class="smeta" style="text-align:left;margin-top:6px">Off is safer: clients then see the server as unsynchronised instead of trusting a drifting clock.</div></div>
  </div>
  <div class="sst" :class="msgCls" v-if="msg">{{ msg }}</div>
  <div class="actions"><button class="btn" :disabled="busy" @click="save">SAVE</button></div>
  </template>

  <!-- LOG -->
  <div class="grid" v-if="tab==='log'">
    <div class="card full">
      <div class="lbl">Log</div>
      <div class="logbar">
        <div class="f"><label class="slbl">Source</label><select v-model="logSel.source" @change="loadLog">
          <option value="all">All AVAntp services</option><option value="web">WebUI</option><option value="apply">Apply (network, firewall)</option>
          <option value="timecode">Timecode sender</option><option value="update">Update mode</option><option value="firewall">Firewall at boot</option>
          <option value="chrony">chrony (NTP)</option><option value="network">Network (networkd, DNS)</option><option value="kernel">Kernel (NIC links, hardware)</option></select></div>
        <div class="f"><label class="slbl">Level</label><select v-model="logSel.level" @change="loadLog">
          <option value="all">Everything</option><option value="warning">Warnings and errors</option><option value="error">Errors only</option></select></div>
        <div class="f"><label class="slbl">Boot</label><select v-model.number="logSel.boot" @change="loadLog">
          <option :value="0">This boot</option><option :value="-1">Previous boot</option><option :value="-2">2 boots ago</option><option :value="-3">3 boots ago</option></select></div>
        <div class="f"><label class="slbl">Lines</label><select v-model.number="logSel.lines" @change="loadLog"><option>100</option><option>200</option><option>500</option><option>1000</option></select></div>
        <label class="chk" style="margin-bottom:6px"><input type="checkbox" v-model="logSel.auto"> update every 3 s</label>
        <button class="btn ghost" @click="loadLog(); loadBoots()">REFRESH</button>
        <button class="btn ghost" @click="copyLog">COPY</button>
      </div>
      <div class="sst err" v-if="logErr" style="margin:0 0 10px">{{ logErr }}</div>
      <div class="logbox" ref="logbox"><template v-if="logLines.length"><div v-for="(l, i) in logLines" :key="i" class="ln" :class="logCls(l)">{{ l }}</div></template>
        <div v-else class="ln dim">{{ logLoaded ? 'No log lines for this selection.' : 'Loading…' }}</div></div>
      <div class="smeta" style="text-align:left;margin-top:8px">{{ logLines.length }} lines. Errors are red, warnings yellow. A crash of a service shows up as "Traceback" or "unhandled exception" under <b>All AVAntp services</b>; a power loss or reset shows up below as a boot that "ended abruptly".</div>
    </div>
    <div class="card full">
      <div class="lbl">Boot history</div>
      <table v-if="boots.length"><thead><tr><th>Boot</th><th>Started</th><th>Last log entry</th><th>How it ended</th></tr></thead>
        <tbody><tr v-for="b in boots" :key="b.index"><td>{{ b.index === 0 ? 'this boot' : b.index }}</td><td>{{ dt(b.first) }}</td><td>{{ dt(b.last) }}</td>
          <td><span class="pillbtn" :class="b.ended === 'clean' ? 'good' : b.ended === 'running' ? 'good' : 'bad'">{{ b.ended === 'clean' ? 'clean shutdown' : b.ended === 'running' ? 'running' : 'ended abruptly' }}</span>
            <span v-if="b.ended === 'abrupt'" style="color:var(--muted);font-size:10px"> no shutdown was logged: power loss, reset or crash</span></td></tr></tbody></table>
      <div v-else class="smeta" style="text-align:left">{{ bootsErr || 'No boot history available.' }}</div>
    </div>
  </div>

  <!-- SYSTEM -->
  <div class="sform" v-if="tab==='system'">
    <div class="card"><div class="lbl">Re-apply</div>
      <div class="smeta" style="text-align:left;margin-bottom:12px">Loads the active configuration again, with the same safety net (confirm within 90 s). Use it after a software update, so the box gets the newest firewall and network rules.</div>
      <button class="btn ghost" :disabled="busy || !cfg.active || ap.state==='applying' || ap.state==='pending-confirm'" @click="applyNow(true)">RE-APPLY CURRENT CONFIG</button>
    </div>
    <div class="card"><div class="lbl">Update mode</div>
      <div class="cr"><span class="ck">State</span><span class="cv" :class="um.state==='on' ? 'warnc' : ''">{{ um.state==='on' ? 'ON, ' + umLeftText + ' left' : 'off' }}</span></div>
      <div class="smeta" style="text-align:left;margin:8px 0 12px">Normally the box may only use NTP, DNS and DHCP towards the WAN, so <b>apt</b> cannot download anything. Update mode opens web access (ports 80 and 443, WAN side only) for 15 minutes and closes it again by itself. The LAN and WAN sides stay separated.</div>
      <button class="btn" v-if="um.state!=='on'" :disabled="busy || ap.state==='applying' || ap.state==='pending-confirm' || !cfg.active" @click="setUpdateMode(true)">ENTER UPDATE MODE</button>
      <button class="btn ghost" v-else :disabled="busy" @click="setUpdateMode(false)">END UPDATE MODE</button>
      <div class="smeta" style="text-align:left;margin-top:10px" v-if="!cfg.active">Apply a configuration first: the firewall is not loaded yet.</div>
      <div class="smeta" style="text-align:left;margin-top:10px" v-else-if="um.state==='on'">On the box now run: <b>sudo apt update &amp;&amp; sudo apt upgrade</b></div>
      <div class="sst err" v-if="um.state==='error'" style="margin:10px 0 0">{{ um.error }}</div>
    </div>
    <div class="card"><div class="lbl">About</div>
      <div class="cr"><span class="ck">Installed version</span><span class="cv">{{ version || 'unknown' }}</span></div>
      <div class="smeta" style="text-align:left;margin-top:8px">Update on the box: <b>sudo ./deploy/update.sh</b> in the git clone.</div></div>
    <div class="card"><div class="lbl">Change password ({{ user }})</div>
      <form @submit.prevent="changePw">
        <div class="sf"><label class="slbl">Current</label><input type="password" v-model="pw.old" autocomplete="current-password"></div>
        <div class="sf"><label class="slbl">New (min 10 characters)</label><input type="password" v-model="pw.new" autocomplete="new-password"></div>
        <div class="sf"><button class="btn" :disabled="busy">CHANGE</button></div>
      </form>
      <div class="sst" :class="msgCls" v-if="msg" style="margin:10px 0 0">{{ msg }}</div>
    </div>
  </div>
  </template>
</div>
<script src="/vue.js"></script>
<script src="/app.js"></script>
</body>
</html>
