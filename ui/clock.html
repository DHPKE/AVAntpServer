<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clock</title>
<style>
@font-face{font-family:'DS-Digital';font-weight:700;src:url('/fonts/ds-digital-700.woff2') format('woff2')}
@font-face{font-family:'Chakra Petch';font-weight:700;src:url('/fonts/chakra-petch-700.woff2') format('woff2')}
@font-face{font-family:'Oxanium';font-weight:700;src:url('/fonts/oxanium-700.woff2') format('woff2')}
@font-face{font-family:'Share Tech Mono';font-weight:400;src:url('/fonts/share-tech-mono-400.woff2') format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#00ee88;--bg:#000;--font:'DS-Digital',monospace;--warn:#ff4d4d}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
body.idle{cursor:none}
#time{font-weight:700;line-height:1;white-space:nowrap;letter-spacing:.05em;font-variant-numeric:tabular-nums}
#time .dig{display:inline-block;width:1ch;text-align:center}
#time .col{display:inline-block;width:.5ch;text-align:center}
#time .ampm{display:inline-block;width:1.6em;font-size:.28em;margin-left:.3em;text-align:left;letter-spacing:.1em;opacity:.6}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
.blink #time .col{animation:blink 1s step-end infinite}
[hidden]{display:none!important}
#date,#sub,#warn{text-align:center;white-space:nowrap;min-height:1.25em;line-height:1.25}
#date{opacity:.55;letter-spacing:.1em}
#sub{opacity:.3;letter-spacing:.12em;text-transform:uppercase}
#warn{color:var(--warn);font-weight:700;letter-spacing:.12em}
#fs{position:fixed;right:14px;bottom:14px;width:44px;height:44px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;font-size:22px;cursor:pointer;opacity:0;transition:opacity .3s}
body:not(.idle) #fs{opacity:.5}
#pick{display:flex;flex-direction:column;gap:12px;font-family:system-ui,sans-serif;font-size:20px}
#pick a{color:var(--fg)}
</style>
</head>
<body class="idle">
<div id="time"></div>
<div id="date"></div>
<div id="sub"></div>
<div id="warn"></div>
<div id="pick"></div>
<button id="fs" type="button" title="Full screen (F)" aria-label="Full screen">&#x26F6;</button>
<script src="/clock.js"></script>
</body>
</html>
